<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Tree JSON Viewer</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111a2b;--panel2:#182338;--text:#e7edf7;--muted:#98a7bd;--line:#34445f;--accent:#60a5fa;--good:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08101d,#0f1a2c);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:24px}.panel{background:rgba(17,26,43,.96);border:1px solid #273550;border-radius:14px;padding:18px;box-shadow:0 14px 40px #0005;margin-bottom:16px}h1{margin:0 0 6px;font-size:24px}p{margin:5px 0;color:var(--muted)}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.drop{border:2px dashed #3b4e6c;border-radius:12px;padding:18px;text-align:center;background:#0c1525;transition:.2s}.drop.drag{border-color:var(--accent);background:#10223c}input[type=file]{max-width:100%}textarea{width:100%;min-height:135px;resize:vertical;background:#0a1322;color:#dce8f8;border:1px solid #33435d;border-radius:9px;padding:10px;font-family:Consolas,monospace}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.toolbar input[type=search]{min-width:220px;flex:1;background:#0a1322;color:var(--text);border:1px solid #33435d;border-radius:8px;padding:9px 11px}button{background:#253552;color:var(--text);border:1px solid #3c5277;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#304568}.primary{background:#1d4f86;border-color:#3479bd}.check{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}#status{min-height:22px;margin-top:9px;color:var(--muted)}#status.ok{color:var(--good)}#status.error{color:var(--bad)}#status.warn{color:var(--warn)}.tree{overflow:auto}.tree ul{list-style:none;margin:0;padding-left:24px;border-left:1px solid var(--line)}.tree>ul{padding-left:0;border:0}.node{margin:7px 0}.node-row{display:flex;align-items:flex-start;gap:7px;background:var(--panel2);border:1px solid #2b3a55;border-radius:9px;padding:8px 10px}.node-row.match{outline:2px solid var(--warn);background:#332b17}.twisty{width:25px;min-width:25px;padding:2px 5px;background:transparent;border:0;font-size:15px}.twisty.blank{visibility:hidden}.node-info{min-width:0;flex:1}.headline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.name{font-weight:700;color:#f4f7fb}.pid{color:#9ecbff;font-family:Consolas,monospace}.ppid{color:var(--muted);font-family:Consolas,monospace}.detail{margin-top:5px;overflow-wrap:anywhere}.label{color:#8fa3bf;font-weight:600;margin-right:6px}.mono{font-family:Consolas,"Courier New",monospace;color:#cdddff}.cmd {margin-top: 6px;padding: 7px;background: #0a1322;border-radius: 7px;border: 1px solid #263650;white-space: pre-wrap;overflow-wrap: anywhere;word-break: break-word;max-width: 100%;}.hidden{display:none!important}.empty{color:var(--muted);padding:25px;text-align:center}.badge{font-size:12px;color:#111827;background:var(--warn);border-radius:999px;padding:1px 7px}.invalid{border-color:#6b4a27}.invalid .name{color:var(--warn)}@media(max-width:760px){.input-grid{grid-template-columns:1fr}.app{padding:12px}.panel{padding:13px}.tree ul{padding-left:13px}.node-row{padding:7px}}
</style>
</head>
<body>
<main class="app">
<section class="panel">
<h1>Process Tree JSON Viewer</h1>
<p>Load a JSON file or paste JSON. Data stays in this browser tab and is not uploaded.</p>
<div class="input-grid">
  <div id="dropZone" class="drop"><strong>Select or drop a JSON file</strong><br><br><input id="fileInput" type="file" accept="application/json,.json"></div>
  <div><label for="jsonText"><strong>Or paste JSON</strong></label><textarea id="jsonText" spellcheck="false" placeholder='[{"Id":1316,"ParentId":788,"Name":"fontdrvhost.exe","Children":[]}]'></textarea></div>
</div>
<div class="toolbar">
  <button id="renderPaste" class="primary">Render pasted JSON</button>
  <button id="clearAll">Clear</button>
</div>
<div id="status" role="status" aria-live="polite">Waiting for JSON data.</div>
</section>
<section id="viewerPanel" class="panel hidden">
<div class="toolbar">
  <input id="pidSearch" type="search" inputmode="numeric" pattern="[0-9]*" placeholder="Search exact PID (example: 1316)" aria-label="Search by exact PID">
  <button id="searchBtn" class="primary">Search PID</button>
  <button id="resetSearch">Reset search</button>
  <button id="expandAll">Expand all</button>
  <button id="collapseAll">Collapse all</button>
  <label class="check"><input id="showCommand" type="checkbox"> Show command lines</label>
</div>
<div id="tree" class="tree"></div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let roots=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
// Some PowerShell exports contain doubled backslashes as actual data. Normalize only for display.
function displayText(v){if(v===null||v===undefined||v==='')return 'Not available';return String(v).replace(/\\\\/g,'\\');}
function validNode(n){return n&&typeof n==='object'&&!Array.isArray(n)&&('Id' in n||'Name' in n);}
function childrenOf(n){return validNode(n)&&Array.isArray(n.Children)?n.Children:[];}
function setStatus(text,type=''){const s=$('status');s.textContent=text;s.className=type;}
function countNodes(items){let count=0,invalid=0;const walk=a=>a.forEach(n=>{if(validNode(n)){count++;walk(childrenOf(n));}else invalid++;});walk(items);return {count,invalid};}
function parseAndRender(text,source){try{const data=JSON.parse(text);roots=Array.isArray(data)?data:[data];if(!roots.length)throw new Error('The JSON array is empty.');renderTree();$('viewerPanel').classList.remove('hidden');const c=countNodes(roots);setStatus(`Loaded ${c.count} process node${c.count===1?'':'s'} from ${source}.${c.invalid?` ${c.invalid} malformed child entr${c.invalid===1?'y was':'ies were'} retained as warnings.`:''}`,c.invalid?'warn':'ok');}catch(e){roots=[];$('tree').innerHTML='';$('viewerPanel').classList.add('hidden');setStatus(`Unable to parse JSON: ${e.message}`,'error');}}
function nodeElement(n,depth=0){const li=document.createElement('li');li.className='node';if(!validNode(n)){li.innerHTML=`<div class="node-row invalid"><span class="twisty blank">•</span><div class="node-info"><span class="name">Malformed child entry</span><div class="detail mono">${esc(displayText(n))}</div></div></div>`;return li;}
 const kids=childrenOf(n), hasKids=kids.length>0;li.dataset.pid=String(n.Id??'');li.dataset.node='true';
 const row=document.createElement('div');row.className='node-row';
 row.innerHTML=`<button class="twisty ${hasKids?'':'blank'}" aria-label="${hasKids?'Toggle children':'No children'}" aria-expanded="false">${hasKids?'▶':'•'}</button><div class="node-info"><div class="headline"><span class="name">${esc(n.Name??'Unnamed process')}</span><span class="pid">PID: ${esc(n.Id??'N/A')}</span><span class="ppid">Parent PID: ${esc(n.ParentId??'N/A')}</span>${hasKids?`<span class="badge">${kids.length} child${kids.length===1?'':'ren'}</span>`:''}</div><div class="detail"><span class="label">Path:</span><span class="mono">${esc(displayText(n.Path))}</span></div><div class="cmd ${$('showCommand').checked?'':'hidden'}"><span class="label">CommandLine:</span><span class="mono">${esc(displayText(n.CommandLine))}</span></div></div>`;
 li.appendChild(row);
 if(hasKids){const ul=document.createElement('ul');ul.className='hidden';kids.forEach(k=>ul.appendChild(nodeElement(k,depth+1)));li.appendChild(ul);row.querySelector('.twisty').addEventListener('click',()=>setExpanded(li,ul.classList.contains('hidden')));}
 return li;}
function setExpanded(li,open){const ul=li.querySelector(':scope > ul'),btn=li.querySelector(':scope > .node-row .twisty');if(!ul)return;ul.classList.toggle('hidden',!open);btn.textContent=open?'▼':'▶';btn.setAttribute('aria-expanded',String(open));}
function renderTree(){const tree=$('tree');tree.innerHTML='';const ul=document.createElement('ul');roots.forEach(n=>ul.appendChild(nodeElement(n)));tree.appendChild(ul);}
function allNodes(){return [...$('tree').querySelectorAll('li[data-node="true"]')];}
function searchPid(){const q=$('pidSearch').value.trim();allNodes().forEach(li=>{li.classList.remove('hidden');li.querySelector(':scope > .node-row').classList.remove('match')});if(!/^\d+$/.test(q)){setStatus('Enter a numeric PID to search.','error');return;}const matches=allNodes().filter(li=>li.dataset.pid===q);if(!matches.length){setStatus(`PID ${q} was not found.`,'warn');return;}collapseAllNodes();matches.forEach(li=>{li.querySelector(':scope > .node-row').classList.add('match');let p=li.parentElement;while(p&&p.id!=='tree'){if(p.tagName==='UL'){p.classList.remove('hidden');const owner=p.parentElement;if(owner?.matches('li[data-node="true"]'))setExpanded(owner,true);}p=p.parentElement;}});matches[0].scrollIntoView({behavior:'smooth',block:'center'});setStatus(`Found ${matches.length} exact match${matches.length===1?'':'es'} for PID ${q}.`,'ok');}
function collapseAllNodes(){allNodes().forEach(li=>setExpanded(li,false));}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(f)parseAndRender(await f.text(),f.name);});
$('renderPaste').addEventListener('click',()=>parseAndRender($('jsonText').value,'pasted text'));
$('clearAll').addEventListener('click',()=>{$('fileInput').value='';$('jsonText').value='';$('pidSearch').value='';roots=[];$('tree').innerHTML='';$('viewerPanel').classList.add('hidden');setStatus('Waiting for JSON data.');});
$('showCommand').addEventListener('change',e=>$('tree').querySelectorAll('.cmd').forEach(x=>x.classList.toggle('hidden',!e.target.checked)));
$('searchBtn').addEventListener('click',searchPid);$('pidSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPid();});
$('resetSearch').addEventListener('click',()=>{$('pidSearch').value='';renderTree();setStatus('PID filter cleared.','ok');});
$('expandAll').addEventListener('click',()=>allNodes().forEach(li=>setExpanded(li,true)));
$('collapseAll').addEventListener('click',collapseAllNodes);
const dz=$('dropZone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',async e=>{const f=e.dataTransfer.files[0];if(f)parseAndRender(await f.text(),f.name);});
</script>
</body>
</html>
